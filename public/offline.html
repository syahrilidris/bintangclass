<style>

  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;box-sizing:border-box}
  h1{margin:2rem 0 0;font-size:1.5rem}
  p{margin:.75rem 0 0;max-width:20rem;color:rgba(255,255,255,.75);line-height:1.55}
  button{margin-top:2rem;min-width:10rem;min-height:2.6rem;border:0;border-radius:.6rem;background:#0e7c78;color:#fff;font:600 .95rem system-ui,sans-serif;cursor:pointer}
  button:focus-visible{outline:2px solid #13948f;outline-offset:2px}
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="-4 -4 108 108" aria-hidden="true"><polygon points="50.0,0.0 64.7,14.6 85.4,14.6 85.4,35.3 100.0,50.0 85.4,64.7 85.4,85.4 64.7,85.4 50.0,100.0 35.3,85.4 14.6,85.4 14.6,64.7 0.0,50.0 14.6,35.3 14.6,14.6 35.3,14.6" fill="#c39a3f"/></svg>
  <h1>No connection</h1>
  <p>Bintang Class needs the internet to open your centre. Check your Wi-Fi or mobile data, then try again.</p>
